# Every Flutter project has one of these. It names your app, sets the Dart
# version it needs, and lists the packages you depend on.
# Add a package with: flutter pub add <name>
name: mario_kart_world_wiki
description: Mario Kart World Wiki - a reference app for characters, tracks, and karts. My 6ADET final project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  # Lets you preview the app inside a phone frame while you develop in a
  # browser. It is switched off automatically in a release build.
  device_preview: ^1.3.1
  # Design system specifies Poppins for the whole type scale (see
  # lib/theme/theme.dart). google_fonts pulls Poppins at build time so no
  # font files need to be bundled in assets/.
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/background/
    - assets/characters/
    - assets/tracks/
  # Check formatting
  scripts:
    check-formatting:
      run: dart format --output=none --set-exit-if-changed .