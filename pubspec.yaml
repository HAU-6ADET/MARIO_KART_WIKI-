name: mario_kart_world_wiki
description: "Mario Kart World Wiki - a reference app for characters, tracks, and karts."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Design system specifies Poppins for the whole type scale (see
  # lib/theme/theme.dart). google_fonts pulls Poppins at build time so no
  # font files need to be bundled in assets/.
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/characters/
