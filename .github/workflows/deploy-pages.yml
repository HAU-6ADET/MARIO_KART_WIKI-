# Builds the Flutter web app and publishes it to GitHub Pages.
#
# One-time setup in your repository:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# After that, every push to main (or master) redeploys the site. You can also
# run it by hand from the Actions tab ("Run workflow").
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Needed by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      # Project sites live at https://<user>.github.io/<repo>/ so the app
      # must be built with base href "/<repo>/". A repository named
      # <user>.github.io is served from the root instead.
      - name: Work out the base href
        id: base
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == *.github.io ]]; then
            echo "href=/" >> "$GITHUB_OUTPUT"
          else
            echo "href=/${repo}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build web
        run: flutter build web --release --base-href "${{ steps.base.outputs.href }}"

      - name: Add 404 fallback
        run: cp build/web/index.html build/web/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4